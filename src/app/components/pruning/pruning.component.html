<ion-item
  class="ion-no-padding bg-transparent"
  lines="none"
>
  <ion-label>Rückschnitt</ion-label>

  <ion-checkbox
    slot="end"
    [checked]="(plantForm$ | async)?.pruning?.enabled"
    (ionChange)="plantFormService.update('pruning.enabled', $event.detail.checked)"
  />
</ion-item>
@if ((plantForm$ | async)?.pruning?.enabled) {
  <!-- <app-range-slider
    class="ion-padding-start"
    label="Wann"
    [range]="monthRange"
    [value]="(plantForm$ | async)?.pruning!.time"
    (valueChange)="plantFormService.update('pruning.time', $event)"
  /> -->
  <!-- <app-choices
    [multiple]="true"
    [choiceName]="monthRange"
    [selected]="(plantForm$ | async)?.pruning?.type ?? []"
    (selectedChange)="plantFormService.update('pruning.type', $event)"
  /> -->

  <ion-select
    multiple="true"
    placeholder="Auswahl der Monate"
    [value]="(plantForm$ | async)?.pruning!.type"
    (ionChange)="plantFormService.update('pruning.type', $event.detail.value)"
    okText="OK"
    cancelText="Abbrechen"
    class="custom-select"
  >
    @for (option of monthRange; track $index) {
      <ion-select-option [value]="option">
        {{ option }}
      </ion-select-option>
    }
  </ion-select>
  <ion-input
    class="ion-padding-start"
    label="Wie viel"
    placeholder="z.B. 1/3"
    [value]="(plantForm$ | async)?.pruning?.amount"
    (ionChange)="plantFormService.update('pruning.amount', $event.detail.value ?? '')"
  />
}
